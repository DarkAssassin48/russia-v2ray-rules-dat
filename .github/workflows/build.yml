name: Build Forkozz catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4,10,16,22 * * *'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: forkozz-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'DarkAssassin48/russia-v2ray-rules-dat'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Test catalog logic
        run: python -m unittest discover -s tests -v
      - name: Install verified official SRS compiler
        run: python scripts/install_sing_box.py --directory "$RUNNER_TEMP/srs-cli"
      - name: Mirror upstream and build catalog with full address documentation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/build_catalog.py
          --repository "$GITHUB_REPOSITORY"
          --output "$RUNNER_TEMP/publish"
          --work "$RUNNER_TEMP/build"
          --cache "$RUNNER_TEMP/cache"
          --sing-box "$RUNNER_TEMP/srs-cli/sing-box"
          --jobs 4
      - name: Verify all rules, details and checksums
        run: python scripts/verify_generated.py "$RUNNER_TEMP/publish" --repository "$GITHUB_REPOSITORY" --pages "$RUNNER_TEMP/build/pages"
      - name: Publish verified snapshot to this fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py "$RUNNER_TEMP/publish" --repository "$GITHUB_REPOSITORY"
      - name: Upload compact catalogs and SRS for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/build/pages
      - name: Write build summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          info=json.loads((Path(os.environ['RUNNER_TEMP'])/'publish/build-info.json').read_text())
          repo=os.environ['GITHUB_REPOSITORY']
          pages=json.loads((Path(os.environ['RUNNER_TEMP'])/'build/pages/build-info.json').read_text())
          print('# Forkozz catalog published')
          print(f"Pages catalogs: full {pages['full_entries']}, medium {pages['medium_entries']}, lite {pages['lite_entries']}.")
          print(f"Version: {info['version']}; domain lists: {info['domain_lists']}; IP lists: {info['ip_lists']}; curated profiles: {info['curated_profiles']}.")
          print(f'\n[Catalog URL](https://raw.githubusercontent.com/{repo}/release/lists.json) · [All addresses](https://github.com/{repo}/blob/release/CATALOG.md)')
          PY

  deploy:
    needs: build
    if: github.repository == 'DarkAssassin48/russia-v2ray-rules-dat'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish catalogs and binary rules on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
